version: '3.8'

services:
  openresty:
    image: openresty/openresty:alpine
    container_name: openresty
    ports:
      - "80:80"
    volumes:
      - ./settings/openresty/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./settings/openresty/lua:/usr/local/openresty/nginx/lua:ro
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      elastic:
        condition: service_healthy
      kibana:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    expose:
      - "3000"
    container_name: frontend-app
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: backend-server
    expose:
      - "8080"
    environment:
      POSTGRES_URL: jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DATABASE}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      ELASTIC_HOST: ${ES_HOST}
      ELASTIC_PORT: ${ES_PORT}
      ELASTIC_ACCESS_USERNAME: ${ES_BACKEND_USER}
      ELASTIC_ACCESS_PASSWORD: ${ES_BACKEND_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      HOST_URL: ${HOST_URL}
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is not set}
      POSTGRES_DB: ${PG_DATABASE}
    expose:
      - "5432"
    command: 
      - postgres 
      - -c 
      - shared_buffers=256MB 
      - -c 
      - effective_cache_size=768MB 
      - -c 
      - work_mem=8MB 
      - -c 
      - maintenance_work_mem=64MB 
      - -c 
      - wal_level=logical 
      - -c 
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      - -c
      - max_slot_wal_keep_size=20GB
    deploy:
      resources:
        limits:
          memory: 1g
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shaper -d akdymall"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    expose:
      - "6379"
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 256m
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  elastic:
    build: ./settings/es
    container_name: elastic
    environment:
      - ELASTIC_PASSWORD=${ES_PASSWORD}
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - ./settings/es/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - es_data:/usr/share/elasticsearch/data
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:$$ELASTIC_PASSWORD http://localhost:9200 | grep -q cluster_name"]
      interval: 10s
      timeout: 10s
      retries: 30
    networks:
      - app-network
    restart: unless-stopped

  kibana:
    image: kibana:9.4.3
    container_name: kibana
    environment:
      ELASTICSEARCH_HOSTS: http://${ES_HOST}:${ES_PORT}
      ELASTICSEARCH_USERNAME: ${KIBANA_ES_USER}
      ELASTICSEARCH_PASSWORD: ${KIBANA_ES_PASSWORD}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY}
    depends_on:
      setup:
        condition: service_completed_successfully
    volumes:
      - ./settings/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    networks:
      - app-network
    restart: unless-stopped

  setup:
    image: curlimages/curl:latest
    container_name: setup
    restart: "no"
    depends_on:
      elastic:
        condition: service_healthy
    environment:
      ELASTIC_PASSWORD: ${ES_PASSWORD:?ES_PASSWORD is not set}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_ES_PASSWORD:?KIBANA_ES_PASSWORD is not set}
      BACKEND_USER: ${ES_BACKEND_USER:?ES_BACKEND_USER is not set}
      BACKEND_PASSWORD: ${ES_BACKEND_PASSWORD:?ES_BACKEND_PASSWORD is not set}
    entrypoint: [""]
    command: >
      sh -c '
        echo "Waiting to set kibana_system password...";
        until resp=$$(curl -s -X POST -u "elastic:$$ELASTIC_PASSWORD" \
            -H "Content-Type: application/json" \
            http://elastic:9200/_security/user/kibana_system/_password \
            -d "{\"password\":\"$$KIBANA_SYSTEM_PASSWORD\"}") \
          && echo "$$resp" | grep -q "^{}"; do
          echo "retrying... (response: $$resp)";
          sleep 5;
        done;
        echo "kibana_system password set";

        echo "Creating backend role...";
        until resp=$$(curl -s -X PUT -u "elastic:$$ELASTIC_PASSWORD" \
            -H "Content-Type: application/json" \
            http://elastic:9200/_security/role/backend_role \
            -d "{\"indices\":[{\"names\":[\"akdymall-*\"],\"privileges\":[\"create_index\",\"read\",\"write\",\"view_index_metadata\"]}]}") \
          && echo "$$resp" | grep -q "\"created\""; do
          echo "retrying role... (response: $$resp)";
          sleep 5;
        done;
        echo "backend role created";

        echo "Creating backend user...";
        until resp=$$(curl -s -X PUT -u "elastic:$$ELASTIC_PASSWORD" \
            -H "Content-Type: application/json" \
            "http://elastic:9200/_security/user/$$BACKEND_USER" \
            -d "{\"password\":\"$$BACKEND_PASSWORD\",\"roles\":[\"backend_role\"]}") \
          && echo "$$resp" | grep -q "\"created\""; do
          echo "retrying user... (response: $$resp)";
          sleep 5;
        done;
        echo "backend user created";
      '
    networks:
      - app-network

  pgsync:
    build: ./settings/pgsync
    container_name: pgsync
    environment:
      PG_HOST: ${PG_HOST}
      PG_PORT: ${PG_PORT}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      ELASTICSEARCH_HOST: ${ES_HOST}
      ELASTICSEARCH_PORT: ${ES_PORT}
      ELASTICSEARCH_USER: elastic
      ELASTICSEARCH_PASSWORD: ${ES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elastic:
        condition: service_healthy
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  es_data: