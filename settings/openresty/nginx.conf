# =============================================================================
#  OpenResty (docker)
#  마운트: ./openresty/nginx.conf -> /usr/local/openresty/nginx/conf/nginx.conf
#          ./openresty/lua        -> /usr/local/openresty/nginx/lua
#          ./openresty/certs      -> /etc/nginx/certs        (SSL 적용 시)
# =============================================================================

user                nobody;
worker_processes    auto;

error_log           /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # 로그
    # -------------------------------------------------------------------------
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'host="$host" rt=$request_time urt="$upstream_response_time"';

    access_log      /dev/stdout main;

    # -------------------------------------------------------------------------
    # 기본
    # -------------------------------------------------------------------------
    sendfile             on;
    tcp_nopush           on;
    server_tokens        off;
    keepalive_timeout    65;
    client_max_body_size 10m;
    client_body_timeout  15s;
    client_header_timeout 15s;

    # merge_slashes / URI 정규화는 기본값(on) 유지 — 경로 우회 방지

    # -------------------------------------------------------------------------
    # WebSocket: Upgrade 헤더가 없을 때 Connection: close 로 처리
    # -------------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    # -------------------------------------------------------------------------
    # Rate Limit
    # -------------------------------------------------------------------------
    limit_req_zone  $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=api:10m     rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=auth:10m    rate=10r/m;
    limit_req_status 429;

    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_status 429;

    # -------------------------------------------------------------------------
    # 업스트림 (keepalive 로 커넥션 재사용)
    # -------------------------------------------------------------------------
    upstream frontend_up { server frontend:3000; keepalive 32; }
    upstream backend_up  { server backend:8080;  keepalive 32; }
    upstream kibana_up   { server kibana:5601;   keepalive 8;  }

    # =========================================================================
    #  기본 서버: 알 수 없는 Host 는 응답 없이 종료 (Host 헤더 조작 차단)
    # =========================================================================
    server {
        listen      80 default_server;
        server_name _;
        access_log  off;
        return      444;
    }

    # =========================================================================
    #  HTTP -> HTTPS 리다이렉트  (인증서 발급 후 아래 주석 해제)
    # =========================================================================
    # server {
    #     listen      80;
    #     server_name example.com www.example.com 122.153.79.24;
    #
    #     # Let's Encrypt 갱신 경로는 평문 허용
    #     location ^~ /.well-known/acme-challenge/ {
    #         root /var/www/certbot;
    #     }
    #     location / { return 301 https://$host$request_uri; }
    # }

    # =========================================================================
    #  메인 서버
    # =========================================================================
    server {
        # --- HTTPS 적용 후 아래 3줄로 교체 ---
        # listen                    443 ssl;
        # http2                     on;
        # ssl_certificate           /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key       /etc/nginx/certs/privkey.pem;
        # ssl_protocols             TLSv1.2 TLSv1.3;
        # ssl_prefer_server_ciphers off;
        # ssl_session_cache         shared:SSL:10m;
        # ssl_session_timeout       1d;
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        listen 80;

        # ★ 실제 도메인으로 교체. 여기에 없는 Host 는 위 default_server 가 444 로 차단.
        #    localhost 는 도커 헬스체크용으로 유지.
        server_name example.com www.example.com 122.153.79.24 localhost;

        # --- 보안 헤더 ---
        # 주의: 하위 location 에서 add_header 를 쓰면 이 블록은 상속되지 않음
        add_header X-Frame-Options        "SAMEORIGIN"                      always;
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection       "0"                               always;
        add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
        # CSP 는 Next.js 인라인 스크립트와 충돌하므로 nonce 구성 후 적용 권장
        # add_header Content-Security-Policy "default-src 'self'; ..." always;

        limit_conn perip 50;

        # ---------------------------------------------------------------------
        # 노이즈 차단: 백엔드까지 가기 전에 끊음
        # ---------------------------------------------------------------------
        location ~ /\.(env|git|aws|ssh|npmrc|netrc|kube|DS_Store) { access_log off; return 404; }
        location ~ \.(map|sql|bak|old|save|swp)$                  { access_log off; return 404; }
        location ~* (eval-stdin\.php|pearcmd|phpinfo|wp-config|/cgi-bin/) { access_log off; return 404; }
        location = /robots.txt { access_log off; return 200 "User-agent: *\nDisallow: /kibana\n"; }

        # ---------------------------------------------------------------------
        # Kibana — 내부망 전용
        # ---------------------------------------------------------------------
        location /kibana {
            # ★ 실제 도커 서브넷 확인 후 조정 (에러로그상 172.18.x 로 추정)
            #   docker network inspect <net> --format '{{range .IPAM.Config}}{{.Subnet}}{{end}}'
            allow 172.18.0.0/16;      # 도커 브리지
            allow 192.168.0.0/24;     # 내부 네트워크
            deny  all;                # 서버 공인 IP(122.153.79.24)는 의도적으로 제외

            proxy_pass http://kibana_up;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id         "";
            proxy_set_header X-User-Role       "";

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 300s;   # 장기 쿼리 대응
            proxy_send_timeout 300s;
            proxy_buffering    off;
        }

        # ---------------------------------------------------------------------
        # 인증 API — 세션 검증 없이 통과, 대신 강한 rate limit
        # ---------------------------------------------------------------------
        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;   # 무차별 대입 방어

            proxy_pass http://backend_up;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;   # 클라이언트 XFF 무시
            proxy_set_header X-Forwarded-Proto $scheme;

            # ★ 클라이언트가 보낸 인증 헤더 제거 (헤더 주입 방지)
            proxy_set_header X-User-Id   "";
            proxy_set_header X-User-Role "";

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ---------------------------------------------------------------------
        # 그 외 API — Lua 세션 검증 후 프록시
        # ---------------------------------------------------------------------
        location /api/v1/ {
            limit_req zone=api burst=20 nodelay;

            set $auth_user_id   '';
            set $auth_user_role '';

            access_by_lua_file /usr/local/openresty/nginx/lua/verify_session.lua;

            # 인증 결과로 덮어씀
            proxy_set_header X-User-Id   $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://backend_up;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ---------------------------------------------------------------------
        # 프론트엔드 (Next.js)
        # ---------------------------------------------------------------------
        resolver 127.0.0.11 valid=10s ipv6=off; 
        location / {
            limit_req zone=general burst=60 nodelay;

            proxy_pass http://frontend_up;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id         "";
            proxy_set_header X-User-Role       "";

            # ★ CVE-2025-29927: Next.js 미들웨어 인증 우회 차단
            proxy_set_header x-middleware-subrequest    "";
            proxy_set_header x-middleware-subrequest-id "";

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;   # HMR 웹소켓 지원

            proxy_read_timeout 60s;
        }
    }
}